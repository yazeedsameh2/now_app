name: Build NOW

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the run still in progress for the same branch.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORMAT_PATHS: lib/main.dart lib/app lib/core lib/database lib/features lib/shared test

jobs:
  verify:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: now_project
    steps:
      - uses: actions/checkout@v4
      - name: Extract compressed NOW project
        working-directory: .
        run: |
          test -f now_app.zip || { echo "now_app.zip is missing from the repository root"; exit 1; }
          rm -rf now_project
          mkdir -p now_project
          unzip -q -o now_app.zip -d now_project
          test -f now_project/pubspec.yaml || {
            echo "pubspec.yaml was not found at the root of the extracted archive."
            echo "Archive contents:"
            unzip -Z1 now_app.zip | head -80
            exit 1
          }
          echo "NOW project extracted successfully."
          ls -la now_project | head -40
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      # Drift tests open a real SQLite database on the runner.
      - name: Install SQLite
        run: sudo apt-get update -y && sudo apt-get install -y libsqlite3-dev
      - run: flutter pub get
      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # Non-blocking until the first clean format pass (see formatting-patch).
      - name: Format check
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed $FORMAT_PATHS
      - run: flutter analyze
      - run: flutter test
      - name: Produce formatting patch
        if: always()
        run: |
          git add -A
          dart format $FORMAT_PATHS
          git diff > formatting.patch
          wc -l formatting.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: formatting-patch
          path: now_project/formatting.patch
          if-no-files-found: warn
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pubspec-lock
          path: now_project/pubspec.lock
          if-no-files-found: warn
          retention-days: 3

  android:
    name: Android release APK (arm64, small)
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: now_project
    steps:
      - uses: actions/checkout@v4
      - name: Extract compressed NOW project
        working-directory: .
        run: |
          test -f now_app.zip || { echo "now_app.zip is missing from the repository root"; exit 1; }
          rm -rf now_project
          mkdir -p now_project
          unzip -q -o now_app.zip -d now_project
          test -f now_project/pubspec.yaml || {
            echo "pubspec.yaml was not found at the root of the extracted archive."
            unzip -Z1 now_app.zip | head -80
            exit 1
          }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform folder
        run: |
          # The source archive may contain only notification resource files
          # under android/, which is not a complete Flutter Android project.
          # Check for the actual Gradle app file, not merely the directory.
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            rm -rf android "$RUNNER_TEMP/scaffold"
            flutter create --platforms=android --project-name now_app \
              --org com.example.now "$RUNNER_TEMP/scaffold"
            test -f "$RUNNER_TEMP/scaffold/android/app/build.gradle.kts" -o \
                 -f "$RUNNER_TEMP/scaffold/android/app/build.gradle"
            cp -r "$RUNNER_TEMP/scaffold/android" android
          fi
      - name: Show Android toolchain (for diagnosis)
        run: |
          cat android/settings.gradle.kts || cat android/settings.gradle || true
          cat android/gradle/wrapper/gradle-wrapper.properties || true
      - name: Patch Android for notifications
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Generate NOW launcher icons
        run: dart run flutter_launcher_icons
      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      # One ABI only (arm64: virtually every phone made after 2017), release
      # mode: much smaller than a universal debug APK.
      - name: Build release APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Report APK size
        run: ls -l build/app/outputs/flutter-apk/app-release.apk
      # Uploaded as a plain .apk (no zip), so it installs straight from download.
      - uses: actions/upload-artifact@v7
        with:
          path: now_project/build/app/outputs/flutter-apk/app-release.apk
          archive: false
          retention-days: 3

  # Manual only: macOS minutes cost 10x on private repositories.
  # Compile check only; this does NOT produce an installable iPhone app.
  ios:
    name: iOS compile check (unsigned)
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: macos-latest
    defaults:
      run:
        working-directory: now_project
    steps:
      - uses: actions/checkout@v4
      - name: Extract compressed NOW project
        working-directory: .
        run: |
          test -f now_app.zip || { echo "now_app.zip is missing from the repository root"; exit 1; }
          rm -rf now_project
          mkdir -p now_project
          unzip -q -o now_app.zip -d now_project
          test -f now_project/pubspec.yaml || {
            echo "pubspec.yaml was not found at the root of the extracted archive."
            unzip -Z1 now_app.zip | head -80
            exit 1
          }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform folder
        run: |
          if [ ! -d ios ]; then
            flutter create --platforms=ios --project-name now_app \
              --org com.example.now "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/ios" ios
          fi
      - run: flutter pub get
      - name: Generate code (drift)
        run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - run: flutter build ios --release --no-codesign
